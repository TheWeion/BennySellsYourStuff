; ============================
; Benny Sells Your Stuff - Configuration
; ============================
;
; [Main]
;   @prop {Integer: 1/0} bEnabled        - Master switch. Set to 0 to disable the mod entirely.
;   @prop {Integer: 1/0} bDebug          - Prints diagnostic messages to the console (consoleout.txt):
;                                          every sale attempt (target, pick mode, both luck rolls,
;                                          sold/saved), every settlement summary with Benny's effective
;                                          stats, and a full ledger table of everything sold when his
;                                          fencing spree ends.
;   @prop {Integer: 1/0} bNotifyOnSettle - Shows a one-time corner message when Benny's fencing spree
;                                          ends (he died, or you arranged the meeting) and you actually
;                                          lost something.
;
;
; [Balance]
;   @prop {Float}   fGraceDays          - Days after the humbling before Benny starts selling. He has to
;                                         get back to the Strip and line up buyers, after all.
;   @prop {Float}   fBaseAttemptsPerDay - Baseline sale attempts per in-game day, before Charisma and
;                                         escalation scaling. Effective rate = this * (0.5 + effCHA/10)
;                                         * escalation; with vanilla Benny (CHA 3) the default 2.0 works
;                                         out to ~1.7 attempts/day in week one, climbing from there.
;   @prop {Float}   fEscalationPerWeek  - Additional rate multiplier per week elapsed since the humbling
;                                         (0.25 = +25% per week). The longer you take, the bolder he gets.
;   @prop {Float}   fCapsSpendPerDay    - Baseline caps Benny spends from the safe per in-game day
;                                         (only matters with bCapRemoval=0 in BHYSYS's Humbling.ini).
;   @prop {Float}   fLuckModWeight      - How strongly the Luck difference between you and Benny shifts
;                                         his effective INT/CHA/LCK. effStat = stat + (BennyLCK - YourLCK) * this.
;   @prop {Integer} iLuckRollDie        - Die size for the contested luck roll (dN + Luck vs dN + Luck).
;                                         Default 20. SMALLER dice make the Luck gap matter more: at
;                                         player LCK 4 vs Benny eff 5.5, Benny wins ~57% on a d20, ~64%
;                                         on a d10, ~72% on a d6. Also compresses win margins, so lots
;                                         get smaller too - retune iLotMarginDivisor if you go low.
;   @prop {Integer} iCapsFloor          - Benny never dips below this many caps in the safe. Defaults to
;                                         130.
;   @prop {Integer} iSmartPickWeightPct - Chance per point of Benny's effective Intelligence that he
;                                         recognizes and targets your most valuable item (8 = INT 5 gives
;                                         a 40% smart pick). Otherwise he grabs something at random.
;   @prop {Integer} iCheapItemValue     - Items with a base value below this count as "cheap" and sell
;                                         in larger lots per deal (see fCheapLotWeight).
;   @prop {Integer} iLotMarginDivisor   - For non-cheap stacked items: Benny sells
;                                         1 + floor(winMargin / this) units per deal, where winMargin is
;                                         how much his luck roll beat yours by. Lower = bigger lots.
;   @prop {Float}   fCheapLotWeight     - For cheap stacked items: Benny sells
;                                         1 + floor((winMargin + effCHA) * this) units per deal.
;   @prop {Integer} iMaxAttemptsPerSettle - Safety cap on sale attempts processed in a single catch-up
;                                           pass. Leave it alone unless you know why you're changing it.
;
; [Fencing]
;   Which item categories Benny is willing (or able to find a buyer) to fence.
;   Set a category to 0 and those items are never sold - they stay in the safe.
;   Quest items, the safe key, and Benny's note are always protected regardless.
;
;   @prop {Integer: 1/0} bFenceWeapons    - Weapons.
;   @prop {Integer: 1/0} bFenceArmor      - Armor and clothing (except power armor).
;   @prop {Integer: 1/0} bFencePowerArmor - Power armor. Hard to move discreetly, easy to make an
;                                           exception for.
;   @prop {Integer: 1/0} bFenceAid        - Aid: food, drink, chems, stimpaks (all ingestibles).
;   @prop {Integer: 1/0} bFenceAmmo       - Ammunition.
;   @prop {Integer: 1/0} bFenceBooks      - Books, magazines and skill books.
;   @prop {Integer: 1/0} bFenceMisc       - Miscellaneous items (scrap, chips, caravan cards...).
;   @prop {Integer: 1/0} bFenceWeaponMods - Weapon mods.
;   @prop {Integer: 1/0} bFenceKeys       - Keys. Default 0: even non-quest keys can gate content,
;                                           and Benny has SOME standards. Enable at your own risk.
;   @prop {Integer: 1/0} bFenceOther      - Catch-all for anything not covered above.
;   @prop {Integer: 1/0} bSpendCaps       - Whether Benny spends the caps stored in the safe (only
;                                           relevant with bCapRemoval=0 in BHYSYS's Humbling.ini).
;                                           Set to 0 and the caps channel is off entirely - he'll
;                                           fence your gear but your caps stay untouched.
;
;   Turning everything off makes Benny's spree purely cosmetic - nothing
;   leaves the safe.
;
; [DangerZone]
;   @prop {Integer: 1/0} bUninstall - Set to 1 to begin the uninstall process upon next save load.

[Main]
bEnabled = 1
bDebug = 0
bNotifyOnSettle = 1

[Balance]
fGraceDays = 1.0
fBaseAttemptsPerDay = 2.0
fEscalationPerWeek = 0.25
fCapsSpendPerDay = 40
fLuckModWeight = 0.5
iLuckRollDie = 20
iCapsFloor = 130
iSmartPickWeightPct = 8
iCheapItemValue = 25
iLotMarginDivisor = 6
fCheapLotWeight = 0.75
iMaxAttemptsPerSettle = 500

[Fencing]
bFenceWeapons = 1
bFenceArmor = 1
bFencePowerArmor = 1
bFenceAid = 1
bFenceAmmo = 1
bFenceBooks = 1
bFenceMisc = 1
bFenceWeaponMods = 1
bFenceKeys = 0
bFenceOther = 1
bSpendCaps = 1

[DangerZone]
bUninstall = 0
